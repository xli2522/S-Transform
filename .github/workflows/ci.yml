name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint package and tests
        run: ruff check src tests
      - name: Type check
        run: mypy src tests/typecheck_inverse_kwargs.py
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Run tests with coverage
        run: pytest --cov=s_transform --cov-report=term-missing

  build:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/s-transform-wheel-test
          /tmp/s-transform-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/s-transform-wheel-test/bin/python -c "import importlib.metadata as metadata; requirements = metadata.requires('s-transform') or []; assert not any(requirement.lower().startswith('matplotlib') and 'extra ==' not in requirement.lower() for requirement in requirements); from s_transform import STransform, inverse_s_transform, s_transform; print(STransform, inverse_s_transform, s_transform)"
